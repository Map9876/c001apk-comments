name: Debug

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build release (expect R8 failure)
        run: |
          ./gradlew :app:assembleRelease || echo "BUILD_FAILED_AS_EXPECTED"
          echo "===== missing_rules.txt ====="
          cat app/build/outputs/mapping/release/missing_rules.txt 2>/dev/null || echo "(no missing_rules.txt)"
          echo "===== SketchImageViewLoader AAR 内容 ====="
          AAR=$(ls SketchImageViewLoader/build/outputs/aar/*.aar 2>/dev/null | head -1)
          echo "AAR=$AAR"
          if [ -n "$AAR" ]; then
            unzip -o -q "$AAR" classes.jar -d /tmp/aarcheck
            unzip -l /tmp/aarcheck/classes.jar | grep -iE "relinker|droidsonoids" || echo "(AAR classes.jar 中无 relinker)"
          fi
          echo "===== 模块 javac 输出中的 relinker ====="
          find SketchImageViewLoader/build/intermediates -name "ReLinker*.class" 2>/dev/null || echo "(javac 输出中无 ReLinker.class)"
