name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 可选签名：配置 secrets 后 release 包用自定义密钥签名，否则回退 debug 密钥（构建脚本默认行为）
      - name: Write key
        run: |
          if [ ! -z "${{ secrets.SIGN_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 --decode > key.jks
            echo KEYSTORE_PATH='${{ github.workspace }}/key.jks' >> local.properties
            echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' >> local.properties
            echo KEY_ALIAS='${{ secrets.KEY_ALIAS }}' >> local.properties
            echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}' >> local.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release
        id: buildRelease
        run: |
          ./gradlew :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/c001apk_*.apk dist/c001apk-release.apk

      # 共存版：包名改为 com.example.c001apk.coexist，可与旧版（含原仓库构建）同时安装，
      # 互不影响覆盖安装；数据独立，收藏夹不继承。
      - name: Build coexist release
        id: buildCoexistRelease
        run: |
          sed -i 's|applicationId = "com.example.c001apk.comments"|applicationId = "com.example.c001apk.coexist"|' app/build.gradle.kts
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/c001apk_*.apk dist/c001apk-coexist-release.apk
          git checkout app/build.gradle.kts

      - name: Build debug
        id: buildDebug
        run: |
          ./gradlew :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk dist/c001apk-debug.apk

      # 手动触发时维护一个始终指向最新构建的 latest 标签，
      # 保证 releases/latest/download/... 直链始终可用
      - name: Move latest tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && 'latest' || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && 'Latest Build' || github.ref_name }}
          make_latest: true
          files: |
            dist/c001apk-release.apk
            dist/c001apk-coexist-release.apk
            dist/c001apk-debug.apk
          body: |
            ## 下载（latest 固定地址，始终指向最新构建）

            | 文件 | 包名 | 适用场景 |
            |---|---|---|
            | [c001apk-release.apk](https://github.com/Map9876/c001apk-comments/releases/latest/download/c001apk-release.apk) | `com.example.c001apk.comments` | 本 fork 包名，与上游原版 c001apk(com.example.c001apk) 互不冲突、可共存；若之前装过本 fork 旧版(13.4.1)因签名不同需先卸载本 fork 旧版 |
            | [c001apk-coexist-release.apk](https://github.com/Map9876/c001apk-comments/releases/latest/download/c001apk-coexist-release.apk) | `com.example.c001apk.coexist` | **共存版**，与旧版/原仓库版/本 fork 主版同时安装互不干扰，无需卸载；数据独立，收藏夹不继承 |
            | [c001apk-debug.apk](https://github.com/Map9876/c001apk-comments/releases/latest/download/c001apk-debug.apk) | `com.example.c001apk` | Debug 构建，调试验证用 |

            > 收藏夹迁移请用电脑执行 `adb backup -f c001.ab -noapk com.example.c001apk` 备份旧版，
            > 装新版后 `adb restore c001.ab` 恢复；嫌麻烦就直接装共存版，两个 app 各用各的。

            ## 修复内容

            - 基于 KiritoXDone/c001apk 的实现，移植 V3 请求签名 + 人机验证码(Captcha)处理，
              并将客户端版本标识升级到 16.1.3 / API 16 / Code 2604022。
              酷安服务端对低版本(13.x)游客按版本拦截评论区(v6 返回 403)，升级后游客可正常看主楼与评论；
              若被风控弹验证码，App 内会弹出 NetEase 人机验证，验证一次后本进程内复用。
            - 包名保持 com.example.c001apk.comments，与上游原版 c001apk(com.example.c001apk) 互不冲突、可共存安装。

            ## 构建信息

            - Commit: ${{ github.sha }}
            - 触发方式: ${{ github.event_name }}
