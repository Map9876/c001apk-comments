name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 可选签名：配置 secrets 后 release 包用自定义密钥签名，否则回退 debug 密钥（构建脚本默认行为）
      - name: Write key
        run: |
          if [ ! -z "${{ secrets.SIGN_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 --decode > key.jks
            echo KEYSTORE_PATH='${{ github.workspace }}/key.jks' >> local.properties
            echo KEYSTORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' >> local.properties
            echo KEY_ALIAS='${{ secrets.KEY_ALIAS }}' >> local.properties
            echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}' >> local.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release
        id: buildRelease
        run: |
          ./gradlew :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/c001apk_*.apk dist/c001apk-release.apk

      - name: Build debug
        id: buildDebug
        run: |
          ./gradlew :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk dist/c001apk-debug.apk

      # 手动触发时维护一个始终指向最新构建的 latest 标签，
      # 保证 releases/latest/download/... 直链始终可用
      - name: Move latest tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && 'latest' || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && 'Latest Build' || github.ref_name }}
          make_latest: true
          files: |
            dist/c001apk-release.apk
            dist/c001apk-debug.apk
          body: |
            ## 直链下载（latest 固定地址，始终指向最新构建）

            - Release 构建（推荐安装）：
              https://github.com/Map9876/c001apk-comments/releases/latest/download/c001apk-release.apk
            - Debug 构建：
              https://github.com/Map9876/c001apk-comments/releases/latest/download/c001apk-debug.apk

            > 未配置签名密钥时 release 包使用 debug 密钥签名；若与旧版签名不一致，安装前请先卸载旧版。

            ## 修复内容

            - 修复「评论接口异常，请尝试升级到新版酷安」：酷安服务端对 v6 接口有版本白名单，
              客户端版本过低时评论区、私信等接口统一返回 403。现按服务端认可的版本标识请求
              （X-App-Version 16.6.4 / X-App-Code 2609291 / X-Api-Version 16 /
              X-App-Supported 2310232 / User-Agent CoolMarket/16.6.4-2609291），
              修复方法来自 [CoolapkReviver](https://github.com/fentia/CoolapkReviver)。

            ## 构建信息

            - Commit: ${{ github.sha }}
            - 触发方式: ${{ github.event_name }}
